<!DOCTYPE html>
<!--
  ==========================================================================
  ★ 새 글 작성 방법 ★
  권장: 글 내용을 JSON으로 만들고 `node scripts/factory-publish.js 글.json` 실행
        → 이 형식의 HTML 생성 + js/posts.js 등록 + sitemap.xml 갱신이 한 번에 됩니다.
  수동으로 만들 때는 이 파일을 복사해서 사용하세요.
  1) 이 파일을 같은 폴더(/posts/)에 새 이름으로 복사합니다.
       예: posts/magnesium-rich-foods.html
  2) 아래 [   ] 안의 값들을 바꿔주세요.
       - <title>            : 브라우저 탭 제목
       - meta description   : 검색 노출용 요약 (1~2줄)
       - canonical href     : https://healioo.com/posts/파일명.html
       - body data-cat      : food / info / exercise / diet / disease / life
       - article__cat       : 화면에 보일 카테고리명
       - article__title     : 글 제목
       - article__meta      : 작성일
       - article__body      : 실제 본문 내용 (<p>, <h2>, <ul> 등 자유롭게)
  3) 마지막으로 /js/posts.js 의 POSTS 배열 맨 위에 이 글 정보를 추가합니다.
       (제목/요약/카테고리/날짜/url) → 홈과 카테고리 목록에 자동 노출됩니다.
  ==========================================================================
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[글 제목] · 인사이트랩</title>
  <meta name="description" content="[검색 노출용 요약을 1~2줄로 작성]">
  <link rel="canonical" href="https://healioo.com/posts/[파일명].html">

  <meta property="og:type" content="article">
  <meta property="og:title" content="[글 제목]">
  <meta property="og:description" content="[요약]">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7143828779500885"
          crossorigin="anonymous"></script>
  <script defer src="/js/analytics.js"></script>
</head>
<body data-cat="food"><!-- ← food(건강음식)·info(건강정보)·exercise(건강운동)·diet(다이어트)·disease(질환·병)·life(생활정보) -->
  <header id="site-header"></header>

  <main class="wrap">
    <article class="article">
      <span class="article__cat">건강음식</span><!-- ← 카테고리명 -->
      <h1 class="article__title">[글 제목을 입력하세요]</h1>
      <div class="article__meta">인사이트랩 · 2026-11-25</div>

      <div class="article__body">
        <!-- ▼▼▼ 여기부터 본문을 작성하세요 ▼▼▼ -->
        <figure class="article__figure">
          <img src="/img/[파일명]-1.jpg" alt="[사진 설명]" loading="eager">
          <figcaption>[사진 설명]</figcaption>
        </figure>
        <p class="article__lead">여기에 리드 문단을 작성합니다.</p>

        <div class="keybox">
          <h2>먼저 핵심만</h2>
          <ol>
            <li>핵심 1</li>
            <li>핵심 2</li>
            <li>핵심 3</li>
          </ol>
        </div>

        <h2>소제목 예시</h2>
        <p>문단 내용을 작성합니다.</p>

        <h3>하위 소제목(활용법·팁)</h3>
        <p>이어지는 내용을 작성합니다.</p>

        <p class="disclaimer">※ 글마다 다르게 쓰는 의학적 면책 문구</p>
        <!-- ▲▲▲ 본문 끝 ▲▲▲ -->
      </div>

      <div class="article__nav"><a class="btn" href="/">‹ 홈으로</a></div>
    </article>
  </main>

  <footer id="site-footer"></footer>

  <script src="/js/posts.js"></script>
  <script src="/js/site.js"></script>
</body>
</html>
